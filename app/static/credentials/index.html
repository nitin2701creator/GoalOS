<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalOS — Integrations</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface-hover: #222632;
  --border: #2a2e3b;
  --text: #e4e5e9;
  --text-dim: #8b8fa3;
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --success: #22c55e;
  --success-bg: rgba(34,197,94,0.12);
  --warning: #f59e0b;
  --warning-bg: rgba(245,158,11,0.12);
  --danger: #ef4444;
  --danger-bg: rgba(239,68,68,0.12);
  --info: #3b82f6;
  --info-bg: rgba(59,130,246,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.layout { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
.header { margin-bottom: 32px; }
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.header p { color: var(--text-dim); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--primary); }
.card-header { display: flex; align-items: center; gap: 12px; }
.card-icon {
  width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 20px; flex-shrink: 0;
}
.card-title { font-size: 15px; font-weight: 600; }
.card-type { font-size: 12px; color: var(--text-dim); text-transform: capitalize; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
  border-radius: 20px; font-size: 12px; font-weight: 500;
}
.badge-ok { background: var(--success-bg); color: var(--success); }
.badge-warn { background: var(--warning-bg); color: var(--warning); }
.badge-err { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.card-message { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
.card-actions { display: flex; gap: 8px; margin-top: auto; }
.btn {
  padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; transition: all 0.15s; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--primary); }
.btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid transparent; }
.btn-danger:hover { border-color: var(--danger); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
}
.modal-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 18px; font-weight: 600; }
.modal-close {
  background: none; border: none; color: var(--text-dim); font-size: 20px;
  cursor: pointer; padding: 4px; line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 16px 24px 24px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; color: var(--text-dim); }
.form-group input {
  width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.15s;
}
.form-group input:focus { border-color: var(--primary); }
.form-group .hint { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
.form-group .existing { font-size: 12px; color: var(--success); margin-top: 4px; }
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 500; z-index: 200; animation: slideIn 0.2s ease-out;
}
.toast-ok { background: var(--success); color: #fff; }
.toast-err { background: var(--danger); color: #fff; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.loading { text-align: center; padding: 60px; color: var(--text-dim); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.test-result { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const ICONS = {
  woocommerce: '🛒', google_analytics: '📊', gmail: '📧', calendar: '📅',
  drive: '💾', meta_social: '📱', meta_ads: '📢', linkedin: '💼',
  twitter: '🐦', reddit: '🔴', twenty: '👥', n8n: '⚡',
};

const TYPE_COLORS = {
  commerce: '#f59e0b', analytics: '#3b82f6', email: '#ef4444',
  calendar: '#8b5cf6', storage: '#06b6d4', social: '#6366f1',
  advertising: '#f97316', crm: '#10b981', automation: '#ec4899',
  scheduler: '#64748b', web: '#0ea5e9', website: '#14b8a6',
};

function StatusBadge({ status }) {
  const s = (status || '').toLowerCase();
  let cls = 'badge-info', dot = true;
  if (s.includes('healthy') || s.includes('configured') || s.includes('connected')) cls = 'badge-ok';
  else if (s.includes('not configured') || s.includes('authentication required')) cls = 'badge-warn';
  else if (s.includes('error') || s.includes('failed') || s.includes('not found')) cls = 'badge-err';
  return <span className={`badge ${cls}`}><span className="badge-dot"></span>{status || 'Unknown'}</span>;
}

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return <div className={`toast toast-${type}`}>{message}</div>;
}

function ConfigModal({ integration, onClose, onSave, onTest, onDelete }) {
  const [fields, setFields] = useState([]);
  const [values, setValues] = useState({});
  const [csrf, setCsrf] = useState('');
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);

  useEffect(() => {
    fetch('/api/v1/credentials/csrf').then(r => r.json()).then(d => setCsrf(d.csrf_token));
    fetch(`/api/v1/credentials/${integration.name}`).then(r => r.json()).then(d => {
      setFields(d.fields || []);
      setLoading(false);
    });
  }, [integration.name]);

  const handleSave = async () => {
    setSaving(true);
    try {
      const filtered = {};
      for (const [k, v] of Object.entries(values)) {
        if (v && v.trim()) filtered[k] = v.trim();
      }
      const res = await fetch(`/api/v1/credentials/${integration.name}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: filtered, csrf_token: csrf }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Save failed');
      // Refresh CSRF
      const csrfRes = await fetch('/api/v1/credentials/csrf');
      const csrfData = await csrfRes.json();
      setCsrf(csrfData.csrf_token);
      onSave(data.message);
      onClose();
    } catch (e) {
      onSave(e.message, 'err');
    } finally { setSaving(false); }
  };

  const handleTest = async () => {
    setTesting(true);
    setTestResult(null);
    try {
      const res = await fetch(`/api/v1/credentials/${integration.name}/test`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csrf_token: csrf }),
      });
      const data = await res.json();
      setTestResult({ status: data.status, message: data.message });
      // Refresh CSRF
      const csrfRes = await fetch('/api/v1/credentials/csrf');
      const csrfData = await csrfRes.json();
      setCsrf(csrfData.csrf_token);
    } catch (e) {
      setTestResult({ status: 'ERROR', message: e.message });
    } finally { setTesting(false); }
  };

  const handleDisconnect = async () => {
    if (!confirm('Delete all stored credentials for ' + integration.display_name + '?')) return;
    try {
      await fetch(`/api/v1/credentials/${integration.name}`, { method: 'DELETE' });
      onDelete();
      onClose();
    } catch (e) { onSave(e.message, 'err'); }
  };

  return (
    <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h2>Configure {integration.display_name}</h2>
          <button className="modal-close" onClick={onClose}>&times;</button>
        </div>
        <div className="modal-body">
          {loading ? <div className="loading"><div className="spinner"></div></div> : (
            <>
              {fields.map(f => (
                <div className="form-group" key={f.key}>
                  <label>{f.label}</label>
                  <input
                    type={f.type === 'secret' ? 'password' : 'text'}
                    placeholder={f.has_value ? f.display_hint || '••••••••' : `Enter ${f.label}`}
                    value={values[f.key] || ''}
                    onChange={e => setValues({ ...values, [f.key]: e.target.value })}
                  />
                  {f.has_value && <div className="existing">✓ Currently set ({f.display_hint || '••••'})</div>}
                  <div className="hint">Environment: {f.env_var}</div>
                </div>
              ))}
              {testResult && (
                <div className="test-result" style={{
                  background: testResult.status === 'Healthy' ? 'var(--success-bg)' : 'var(--danger-bg)',
                  color: testResult.status === 'Healthy' ? 'var(--success)' : 'var(--danger)',
                }}>
                  <strong>{testResult.status}:</strong> {testResult.message}
                </div>
              )}
              <div style={{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' }}>
                <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
                  {saving ? 'Saving...' : 'Save Credentials'}
                </button>
                <button className="btn btn-secondary" onClick={handleTest} disabled={testing}>
                  {testing ? 'Testing...' : 'Test Connection'}
                </button>
                {integration.is_configured && (
                  <button className="btn btn-danger" onClick={handleDisconnect}>Disconnect</button>
                )}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function IntegrationCard({ integration, onOpen }) {
  const color = TYPE_COLORS[integration.type] || '#6366f1';
  return (
    <div className="card">
      <div className="card-header">
        <div className="card-icon" style={{ background: color + '20', color }}>
          {ICONS[integration.name] || '🔌'}
        </div>
        <div>
          <div className="card-title">{integration.display_name}</div>
          <div className="card-type">{integration.type}</div>
        </div>
      </div>
      <StatusBadge status={integration.status} />
      {integration.message && <div className="card-message">{integration.message}</div>}
      <div className="card-actions">
        <button className="btn btn-primary" onClick={() => onOpen(integration)}>Configure</button>
        {integration.is_configured && (
          <button className="btn btn-secondary" onClick={() => onOpen(integration)}>Test</button>
        )}
      </div>
    </div>
  );
}

function App() {
  const [integrations, setIntegrations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [toast, setToast] = useState(null);

  const load = useCallback(async () => {
    try {
      const res = await fetch('/api/v1/credentials');
      const data = await res.json();
      setIntegrations(data.integrations || []);
    } catch (e) {
      setToast({ message: 'Failed to load integrations: ' + e.message, type: 'err' });
    } finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  const showToast = (msg, type = 'ok') => setToast({ message: msg, type });

  return (
    <div className="layout">
      <div className="header">
        <h1>GoalOS Integrations</h1>
        <p>Connect and manage external services used by GoalOS.</p>
      </div>
      {loading ? (
        <div className="loading"><div className="spinner"></div><p style={{marginTop:12}}>Loading integrations...</p></div>
      ) : (
        <div className="grid">
          {integrations.map(integ => (
            <IntegrationCard key={integ.name} integration={integ} onOpen={setSelected} />
          ))}
        </div>
      )}
      {selected && (
        <ConfigModal
          integration={selected}
          onClose={() => setSelected(null)}
          onSave={(msg, type) => { showToast(msg, type || 'ok'); load(); }}
          onTest={() => {}}
          onDelete={() => { showToast('Credentials deleted'); load(); }}
        />
      )}
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
